name: Päivitä XMLTV-opas

on:
  schedule:
    # Ajetaan 6 tunnin välein (00, 06, 12, 18 UTC). GitHub viivästyttää ajastettuja ajoja
    # tässä repossa usein 7-8 tuntia, ja Open-EPG:n UK-oppaassa on dataa vain noin
    # vuorokaudeksi eteenpäin - kerran päivässä ajettuna UK-kanavat jäivät aamupäivisin
    # tyhjiksi. Useampi ajo varmistaa, ettei yksi myöhästyminen jätä aukkoa.
    - cron: '0 */6 * * *'
  workflow_dispatch: # Mahdollistaa testiajon käynnistämisen käsin GitHubin kautta

permissions:
  contents: write # Tarvitaan, jotta action voi puskea päivitetyn tiedoston takaisin

jobs:
  update-xml:
    runs-on: ubuntu-latest

    steps:
    - name: Tsekkaa koodi ulos repositoriosta
      uses: actions/checkout@v4

    - name: Asenna XMLTV-työkalut yhdistämistä varten
      run: |
        sudo apt-get update
        sudo apt-get install -y xmltv-util

    - name: Lataa, pura ja yhdistä Open-EPG-lähteet
      run: |
        # Haetaan kaikki lähteet pakattuina (.xml.gz)
        curl -sL "https://www.open-epg.com/files/finland4.xml.gz" | zcat > f4.xml
        curl -sL "https://www.open-epg.com/files/sweden.xml.gz" | zcat > se.xml
        curl -sL "https://www.open-epg.com/files/unitedkingdom.xml.gz" | zcat > uk.xml
        curl -sL "https://www.open-epg.com/generate/DtpfnFX8Tu.xml.gz" | zcat > custom.xml

        # Yhdistetään lähteet vaiheittain tv_merge-komennolla
        tv_merge -i f4.xml -m se.xml -o temp1.xml
        tv_merge -i temp1.xml -m uk.xml -o temp2.xml
        tv_merge -i temp2.xml -m custom.xml -o opas.xml

        # Siivotaan väliaikaiset tiedostot pois
        rm f4.xml se.xml uk.xml custom.xml temp1.xml temp2.xml

    - name: Commit ja Push muutokset
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        if git status --porcelain | grep -q "opas.xml"; then
          git add opas.xml
          git commit -m "Automaattinen EPG päivitys: $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
        else
          echo "Ei muutoksia XMLTV-datassa."
        fi
